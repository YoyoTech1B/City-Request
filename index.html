<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#080b18">

    <title>City Quest</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="app">

        <header class="topbar">

            <div class="logo">
                🏙️ CITY QUEST
            </div>

            <div class="stats">

                <div class="stat">
                    🪙 <span id="coins">0</span>
                </div>

                <div class="stat">
                    ⭐ LVL <span id="level">1</span>/200
                </div>

            </div>

        </header>


        <!-- HOME -->

        <main id="homeScreen" class="hero">

            <div class="hero-content">

                <div id="homeWorldBadge" class="world-badge">
                    WORLD 01
                </div>

                <h1 id="homeWorldName">
                    NEON CITY
                </h1>

                <p>
                    Beat levels. Earn coins. Build your city.
                </p>

                <div class="buttons">

                    <button id="playButton" class="primary-button">
                        PLAY ▶
                    </button>

                    <button id="cityButton" class="secondary-button">
                        MY CITIES 🏙️
                    </button>

                </div>

            </div>

        </main>


        <!-- GAME -->

        <section id="gameScreen" class="screen hidden">

            <button id="backButton" class="back-button">
                ← BACK
            </button>

            <div class="game-card">

                <div id="gameWorldBadge" class="world-badge">
                    WORLD 01
                </div>

                <h2>
                    LEVEL <span id="currentLevel">1</span>
                </h2>

                <p id="challengeTitle">
                    Loading challenge...
                </p>

                <div id="rewardPreview" class="reward-preview">
                    REWARD: 0 🪙
                </div>


                <div id="clickChallenge"
                    class="challenge hidden">

                    <p>
                        Targets:
                        <span id="targetProgress">
                            0 / 10
                        </span>
                    </p>

                    <div id="targetArena"
                        class="target-arena">

                        <button id="targetButton"
                            class="target-button">
                            🎯
                        </button>

                    </div>

                </div>


                <div id="reactionChallenge"
                    class="challenge hidden">

                    <p id="reactionMessage">
                        Wait for the signal...
                    </p>

                    <button id="reactionButton"
                        class="reaction-button">
                        WAIT
                    </button>

                </div>


                <div id="mathChallenge"
                    class="challenge hidden">

                    <div id="mathQuestion"
                        class="math-question">
                    </div>

                    <input id="mathAnswer"
                        type="number"
                        placeholder="Your answer"
                        autocomplete="off">

                    <button id="mathSubmitButton"
                        class="primary-button">
                        ANSWER
                    </button>

                </div>

            </div>

        </section>


        <!-- CITY -->

        <section id="cityScreen"
            class="screen hidden">

            <button id="cityBackButton"
                class="back-button">
                ← BACK
            </button>


            <div class="city-card">

                <div class="city-header">

                    <div>

                        <div id="cityWorldBadge"
                            class="world-badge">
                            WORLD 01
                        </div>

                        <h2 id="cityWorldName">
                            NEON CITY
                        </h2>

                    </div>


                    <div class="world-switcher">

                        <button id="previousWorldButton">
                            ←
                        </button>

                        <span id="selectedWorldNumber">
                            WORLD 1
                        </span>

                        <button id="nextWorldButton">
                            →
                        </button>

                    </div>

                </div>


                <div id="lockedWorldMessage"
                    class="locked-message hidden">

                    🔒 THIS WORLD IS LOCKED

                    <p id="unlockRequirement">
                        Complete more levels.
                    </p>

                </div>


                <div id="cityContent">


                    <div id="cityMap"
                        class="city-map theme-neon">


                        <div class="city-sky"></div>

                        <div class="city-ground"></div>


                        <!-- ROADS -->

                        <div class="road road-horizontal"></div>

                        <div class="road road-vertical"></div>


                        <!-- CITY GRID -->

                        <div id="cityGrid"
                            class="city-grid">
                        </div>


                    </div>


                    <h3 class="build-title">
                        BUILDINGS
                    </h3>


                    <div id="buildingShop"
                        class="building-shop">
                    </div>


                </div>

            </div>

        </section>

    </div>


    <div id="toast"
        class="toast">
    </div>


    <script src="script.js"></script>

</body>
</html>
