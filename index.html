<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#070b18"
    >

    <meta
        name="description"
        content="CITY QUEST — Beat challenges, earn coins, build cities, and conquer 200 levels."
    >

    <title>CITY QUEST</title>

    <link
        rel="icon"
        type="image/png"
        href="favicon.png"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >

    <link
        rel="manifest"
        href="manifest.json"
    >
</head>

<body>

    <div id="app">

        <!-- =========================================
             TOP BAR
        ========================================== -->

        <header class="topbar">

            <div class="logo">
                🏙️ CITY QUEST
            </div>

            <div class="stats">

                <div class="stat">
                    🪙
                    <span id="coins">0</span>
                </div>

                <div class="stat">
                    ⭐
                    <span id="level">1</span>/200
                </div>

            </div>

        </header>


        <!-- =========================================
             HOME SCREEN
        ========================================== -->

        <main
            id="homeScreen"
            class="hero"
        >

            <div class="hero-content">

                <div
                    id="homeWorldBadge"
                    class="world-badge"
                >
                    WORLD 01
                </div>

                <h1 id="homeWorldName">
                    NEON CITY
                </h1>

                <p>
                    Beat challenges.
                    Earn coins.
                    Build your city.
                </p>

                <div class="buttons">

                    <button
                        id="playButton"
                        class="primary-button"
                        type="button"
                    >
                        PLAY ▶
                    </button>

                    <button
                        id="cityButton"
                        class="secondary-button"
                        type="button"
                    >
                        MY CITY 🏙️
                    </button>

                </div>

            </div>

        </main>


        <!-- =========================================
             GAME SCREEN
        ========================================== -->

        <section
            id="gameScreen"
            class="screen hidden"
        >

            <button
                id="backButton"
                class="back-button"
                type="button"
            >
                ← BACK
            </button>


            <div class="game-card">

                <div
                    id="gameWorldBadge"
                    class="world-badge"
                >
                    WORLD 01
                </div>

                <h2>
                    LEVEL
                    <span id="currentLevel">
                        1
                    </span>
                </h2>

                <p id="challengeTitle">
                    Get ready...
                </p>


                <div
                    id="rewardPreview"
                    class="reward-preview"
                >
                    REWARD: 0 🪙
                </div>


                <!-- =================================
                     UNIVERSAL CHALLENGE ENGINE
                ================================== -->

                <div
                    id="challengeArea"
                    class="challenge-area"
                >

                    <div
                        id="challengeHUD"
                        class="challenge-hud"
                    >

                        <div>
                            ❤️
                            <span id="lives">
                                3
                            </span>
                        </div>

                        <div>
                            🔥
                            <span id="combo">
                                0
                            </span>
                        </div>

                        <div>
                            ⏱️
                            <span id="timer">
                                --
                            </span>
                        </div>

                    </div>


                    <div
                        id="challengeIntro"
                        class="challenge-intro"
                    >
                        GET READY...
                    </div>


                    <div
                        id="challengeArena"
                        class="challenge-arena"
                    >
                    </div>


                    <div
                        id="challengeControls"
                        class="challenge-controls"
                    >
                    </div>


                    <div
                        id="challengeMessage"
                        class="challenge-message"
                    >
                    </div>

                </div>

            </div>

        </section>


        <!-- =========================================
             CITY SCREEN
        ========================================== -->

        <section
            id="cityScreen"
            class="screen hidden"
        >

            <button
                id="cityBackButton"
                class="back-button"
                type="button"
            >
                ← BACK
            </button>


            <div class="city-card">

                <div class="city-header">

                    <div>

                        <div
                            id="cityWorldBadge"
                            class="world-badge"
                        >
                            WORLD 01
                        </div>

                        <h2 id="cityWorldName">
                            NEON CITY
                        </h2>

                    </div>


                    <div class="world-switcher">

                        <button
                            id="previousWorldButton"
                            type="button"
                        >
                            ←
                        </button>

                        <span id="selectedWorldNumber">
                            WORLD 1
                        </span>

                        <button
                            id="nextWorldButton"
                            type="button"
                        >
                            →
                        </button>

                    </div>

                </div>


                <!-- LOCKED WORLD -->

                <div
                    id="lockedWorldMessage"
                    class="locked-message hidden"
                >

                    🔒 THIS WORLD IS LOCKED

                    <p id="unlockRequirement">
                        Complete more levels.
                    </p>

                </div>


                <!-- CITY -->

                <div id="cityContent">

                    <div
                        id="cityMap"
                        class="city-map theme-neon"
                    >

                        <div class="city-sky"></div>

                        <div class="city-ground"></div>

                        <div
                            class="road road-horizontal"
                        ></div>

                        <div
                            class="road road-vertical"
                        ></div>

                        <div
                            id="cityGrid"
                            class="city-grid"
                        >
                        </div>

                    </div>


                    <h3 class="build-title">
                        BUILD YOUR CITY
                    </h3>


                    <div
                        id="buildingShop"
                        class="building-shop"
                    >
                    </div>

                </div>

            </div>

        </section>

    </div>


    <!-- =============================================
         TOAST NOTIFICATIONS
    ============================================== -->

    <div
        id="toast"
        class="toast"
        aria-live="polite"
    >
    </div>


    <!-- =============================================
         SCRIPTS
    ============================================== -->

    <script src="script.js"></script>

</body>
</html>
